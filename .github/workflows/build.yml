name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  modules:
    name: modules (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The kernels the package targets: Raspberry Pi OS Bookworm arm64.
          - target: rpi-bookworm-arm64
            runner: ubuntu-24.04-arm
            headers: linux-headers-rpi-v8 linux-headers-rpi-2712
            rpi-archive: true
          # Oldest supported kernel (6.1).
          - target: debian-bookworm-amd64
            runner: ubuntu-latest
            headers: linux-headers-amd64
            rpi-archive: false
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Add the Raspberry Pi archive
        if: matrix.rpi-archive
        run: sh .github/scripts/add-rpi-archive.sh

      - name: Compile the modules for every installed kernel
        run: sh .github/scripts/build-modules.sh ${{ matrix.headers }}

  # Newest Debian kernel, to catch kernel API changes early. Sid is often not
  # installable, so this job is informative: the package does not need it.
  modules-sid:
    runs-on: ubuntu-latest
    container: debian:sid
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compile the modules for every installed kernel
        run: sh .github/scripts/build-modules.sh linux-headers-amd64

  deb:
    needs: modules
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev lintian

      - name: Check tag matches debian/changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(dpkg-parsechangelog -SVersion)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match debian/changelog version $VERSION"
            exit 1
          fi

      - name: Build package
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir -p dist
          mv ../*.deb dist/

      - name: Lintian
        run: lintian --fail-on error dist/*.deb

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb
          path: dist/*.deb

  lifecycle:
    needs: deb
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deb
          path: dist

      - name: Add the Raspberry Pi archive
        run: sh .github/scripts/add-rpi-archive.sh

      - name: Install, upgrade, reinstall, kernel hook, remove and purge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh .github/scripts/lifecycle-test.sh "$(ls "$PWD"/dist/*.deb)"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, lifecycle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deb
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*.deb
          generate_release_notes: true
