name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev lintian linux-headers-amd64

      - name: Compile the module (syntax/API check)
        run: |
          KVER=$(ls /lib/modules | head -n1)
          cp -r src /tmp/mod
          make -C /lib/modules/$KVER/build M=/tmp/mod W=1 modules

      - name: Check tag matches debian/changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(dpkg-parsechangelog -SVersion)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match debian/changelog version $VERSION"
            exit 1
          fi

      - name: Build package
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir -p dist
          mv ../*.deb dist/

      - name: Lintian
        run: lintian --fail-on error dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
